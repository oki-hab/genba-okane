<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="構造のミス">
<meta name="theme-color" content="#1d4ed8">
<title>構造のミス 録音</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%231d4ed8'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf7f1; --card:#ffffff; --ink:#1f1a14; --sub:#6b5f52; --line:#e7dccd;
  --accent:#1d4ed8; --rec:#dc2626; --ok:#15803d; --warn:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171310; --card:#221c17; --ink:#f3ece4; --sub:#b3a595; --line:#3a3029;
    --accent:#f59e0b; --rec:#f87171; --ok:#4ade80; --warn:#fca5a5;
  }
}
:root[data-theme="dark"]{
  --bg:#171310; --card:#221c17; --ink:#f3ece4; --sub:#b3a595; --line:#3a3029;
  --accent:#f59e0b; --rec:#f87171; --ok:#4ade80; --warn:#fca5a5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:8px 0 2px;letter-spacing:.05em}
.lead{color:var(--sub);font-size:14px;margin:0 0 28px;text-align:center}
#btn{width:220px;height:220px;border-radius:50%;border:none;cursor:pointer;background:var(--accent);color:#fff;
  font-size:26px;font-weight:700;letter-spacing:.08em;box-shadow:0 10px 30px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  -webkit-tap-highlight-color:transparent;transition:transform .1s}
#btn:active{transform:scale(.97)}
#btn .dot{width:34px;height:34px;border-radius:50%;background:#fff}
#btn.rec{background:var(--rec);animation:pulse 1.4s infinite}
#btn.rec .dot{width:12px;border-radius:3px;box-shadow:18px 0 0 #fff;margin-right:18px}
#btn.pause{background:var(--accent)}
#btn.pause .dot{width:0;height:0;border-radius:0;background:none;border-style:solid;border-width:17px 0 17px 30px;border-color:transparent transparent transparent #fff;margin-left:8px}
#end{display:none;margin-top:18px;font-size:18px;font-weight:700;padding:14px 28px;border-radius:12px;border:2px solid var(--rec);background:var(--card);color:var(--rec);cursor:pointer}
#end:disabled{opacity:.6;cursor:default}
#btn:disabled{opacity:.6;cursor:default;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%{box-shadow:0 0 0 26px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
#time{font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;margin:22px 0 4px;min-height:42px}
#msg{min-height:48px;text-align:center;font-size:15px;line-height:1.6;max-width:420px}
#msg.ok{color:var(--ok)} #msg.err{color:var(--warn)}
.again{display:none;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.again button,.again a{font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
#list{width:100%;max-width:420px;margin-top:28px;border-top:1px solid var(--line)}
#list div{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub)}
#list b{font-weight:600;color:var(--ink)}
#setup{display:none;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:15px;line-height:1.7}
</style>
</head>
<body>
<h1>構造計算会社のミス</h1>
<p class="lead">構造図・構造計算のミスの話（物件・業者さん・どの図面・何が違ったか・どう直したか）を話してください。<br>押すと録音。録音中に押すと一時停止、もう一度押すと続きから録音。<br>終わったら「終わって送る」を押します</p>

<div id="setup">このページは、配られたリンク（またはデスクトップ・ホーム画面のアイコン）から開いてください。</div>

<button id="btn" type="button" aria-label="録音"><span class="dot"></span><span id="label">録音</span></button>
<button id="end" type="button">■ 終わって送る</button>
<div id="time"></div>
<div id="msg"></div>
<div class="again" id="again"><button id="resend" type="button">もう一度送る</button><a id="save" download>録音を保存</a></div>
<div id="list"></div>

<script>
(function () {
  // 受け取り口（Apps Script のウェブアプリ）
  var 送り先 = 'https://script.google.com/macros/s/AKfycbzHy4GUPVlysOp8f-URZ5Hn0ihgHkjGN1AHqXwPJQEmbbrr5-tbWhWwJOoMbpDKRq_vcg/exec';
  var 上限分 = 60;   // 60分で自動で止めて送る（長すぎると送れないため）

  var 読む = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var 書く = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };

  // 合言葉はリンクの # の後ろ（k=…）。一度開けば覚える
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) 書く('kozo_k', h.get('k'));
  var 合言葉 = h.get('k') || 読む('kozo_k');
  var 自動 = h.has('auto');

  var btn = document.getElementById('btn'), label = document.getElementById('label');
  var time = document.getElementById('time'), msg = document.getElementById('msg');
  var again = document.getElementById('again'), end = document.getElementById('end');
  var rec = null, 片 = [], 時計 = null, 起こし = null, 最後 = null;
  var 録った = 0, 再開した = 0;   // 一時停止のあいだは数えない（録った＝止めるまでに録れたミリ秒）
  var 準備中 = false;             // マイクの準備中にもう一度押されても、録音を2つ始めない（前はこれで止まらなくなった）

  if (!合言葉) { document.getElementById('setup').style.display = 'block'; btn.disabled = true; }

  function 言う(s, cls) { msg.textContent = s; msg.className = cls || ''; }
  function 二桁(n) { return (n < 10 ? '0' : '') + n; }
  function 録れた秒() { return Math.floor((録った + (rec && rec.state === 'recording' ? Date.now() - 再開した : 0)) / 1000); }
  function 経過() {
    var s = 録れた秒();
    time.textContent = 二桁(Math.floor(s / 60)) + ':' + 二桁(s % 60);
    if (s >= 上限分 * 60) 終わる();
  }
  function 見た目(状態) {
    btn.classList.toggle('rec', 状態 === 'recording');
    btn.classList.toggle('pause', 状態 === 'paused');
    label.textContent = 状態 === 'recording' ? (一時停止できる() ? '一時停止' : '止めて送る') : 状態 === 'paused' ? '続きを録音' : '録音';
    end.style.display = (状態 === 'recording' && 一時停止できる()) || 状態 === 'paused' ? 'block' : 'none';
  }
  function 一時停止できる() { return !!(rec && rec.pause && rec.resume); }
  async function 画面を起こす() { try { 起こし = await navigator.wakeLock.request('screen'); } catch (e) {} }   // 携帯の画面が消えて止まらないように
  function 画面を休ませる() { try { 起こし && 起こし.release(); } catch (e) {} 起こし = null; }

  async function 始める() {
    if (準備中 || (rec && rec.state !== 'inactive')) return;
    準備中 = true; btn.disabled = true;
    again.style.display = 'none';
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      言う('マイクが使えません。ブラウザの「マイクを許可」を押してから、もう一度押してください。', 'err');
      準備中 = false; btn.disabled = false;
      return;
    }
    var 型 = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].filter(function (t) {
      return window.MediaRecorder && MediaRecorder.isTypeSupported(t);
    })[0] || '';
    rec = new MediaRecorder(stream, 型 ? { mimeType: 型, audioBitsPerSecond: 32000 } : {});
    片 = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) 片.push(e.data); };
    rec.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      最後 = new Blob(片, { type: rec.mimeType || 型 || 'audio/webm' });
      送る(最後);
    };
    rec.start(1000);
    録った = 0; 再開した = Date.now();
    clearInterval(時計); 時計 = setInterval(経過, 500); 経過();
    準備中 = false; btn.disabled = false; end.disabled = false;
    見た目('recording');
    言う('録音中です');
    画面を起こす();
  }

  // 録音中に押す → 一時停止／一時停止中に押す → 続きから録音
  function 一時停止() {
    if (!rec || rec.state !== 'recording') return;
    if (!一時停止できる()) { 終わる(); return; }   // 古い携帯で一時停止ができないときは、今までどおり止めて送る
    rec.pause();
    録った += Date.now() - 再開した;
    見た目('paused'); 経過();
    言う('一時停止中です（この間は録音していません）。「続きを録音」で再開、「終わって送る」で送ります。');
    画面を休ませる();
  }
  function 再開() {
    if (!rec || rec.state !== 'paused') return;
    rec.resume();
    再開した = Date.now();
    見た目('recording');
    言う('録音中です');
    画面を起こす();
  }

  // 終わって送る（録音中でも一時停止中でも）
  function 終わる() {
    if (!rec || rec.state === 'inactive') return;
    if (rec.state === 'recording') 録った += Date.now() - 再開した;
    clearInterval(時計);
    end.disabled = true;
    rec.stop();
    見た目('inactive');
    画面を休ませる();
  }

  function base64(blob) {
    return new Promise(function (ok, ng) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = ng;
      r.readAsDataURL(blob);
    });
  }

  async function 送る(blob) {
    btn.disabled = true; again.style.display = 'none';
    言う('送っています…（' + Math.max(1, Math.round(blob.size / 1024)) + 'KB）');
    try {
      var body = JSON.stringify({ k: 合言葉, 型: blob.type, data: await base64(blob) });
      var r = await fetch(送り先, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
      var j = await r.json();
      if (!j.ok) throw new Error(j.error || '受け取れませんでした');
      言う('送りました。1〜2分でスプレッドシートに入ります。', 'ok');
      time.textContent = '';
      記録();
      最後 = null;
    } catch (e) {
      言う('送れませんでした（' + e.message + '）。電波の良い所で「もう一度送る」を押してください。', 'err');
      var a = document.getElementById('save');
      a.href = URL.createObjectURL(blob);
      a.download = '構造のミス_' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + (/mp4/.test(blob.type) ? '.m4a' : '.webm');
      again.style.display = 'flex';
    }
    btn.disabled = false;
  }

  function 記録() {
    var 一覧 = [];
    try { 一覧 = JSON.parse(読む('kozo_list') || '[]'); } catch (e) {}
    var d = new Date();
    一覧.unshift(d.getMonth() + 1 + '/' + d.getDate() + ' ' + 二桁(d.getHours()) + ':' + 二桁(d.getMinutes()));
    書く('kozo_list', JSON.stringify(一覧.slice(0, 5)));
    表示();
  }
  function 表示() {
    var 一覧 = [];
    try { 一覧 = JSON.parse(読む('kozo_list') || '[]'); } catch (e) {}
    document.getElementById('list').innerHTML = 一覧.map(function (s) {
      return '<div><b>' + s + '</b><span>送信済み</span></div>';
    }).join('');
  }

  btn.addEventListener('click', function () {
    var s = rec ? rec.state : 'inactive';
    if (s === 'recording') 一時停止();
    else if (s === 'paused') 再開();
    else 始める();
  });
  end.addEventListener('click', 終わる);
  document.getElementById('resend').addEventListener('click', function () { if (最後) 送る(最後); });
  window.addEventListener('beforeunload', function (e) {
    if ((rec && rec.state !== 'inactive') || 最後) { e.preventDefault(); e.returnValue = ''; }
  });
  表示();
  // デスクトップのアイコンから開いたときは、すぐ録音を始める（ワンタッチ）
  if (自動 && 合言葉) 始める();
})();
</script>
</body>
</html>
